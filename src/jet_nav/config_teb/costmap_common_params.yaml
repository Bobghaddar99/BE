footprint: [[-0.105, -0.127], [-0.127, 0.127], [0.127, 0.127], [0.127, -0.127]]
footprint_padding: 0.01

robot_base_frame: base_link
update_frequency: 2
publish_frequency: 2
transform_tolerance: 0.3

resolution: 0.1

obstacle_range: 5.5
raytrace_range: 5.5

#layer definitions
static:
    map_topic: /map
    subscribe_to_updates: true

obstacles_laser:
    observation_sources: laser
    laser: {data_type: LaserScan, clearing: true, marking: true, topic: scan_filter, inf_is_valid: true}

inflation_g:
    inflation_radius: 0.1
    cost_scaling_factor : 5
    
inflation_l:
    inflation_radius: 0.1
    cost_scaling_factor : 6
