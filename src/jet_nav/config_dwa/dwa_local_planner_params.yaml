controller_frequency: 10
controller_patience: 0.5 
planner_patience: 0.5 
recovery_behavior_enabled: false

aggressive_reset:   
     reset_distance: 0.0   
     layer_names: ["obstacles"]     

base_local_planner: dwa_local_planner/DWAPlannerROS 
DWAPlannerROS:   
    # base_local_planner params   
    max_vel_trans: 0.75   
    oscillation_recovery: True
    min_vel_trans: -0.22  
    max_vel_x: 0.55 
    min_vel_x: -0.52  
    max_vel_y: 0
    min_vel_y: 0   
    max_vel_theta: 1.84
    min_vel_theta: -1.84
    trans_stopped_vel: 0   
    theta_stopped_vel: 0   
    acc_lim_x: 2.5
    acc_lim_y: 0  
    acc_lim_theta: 3.2  
    acc_lim_trans: 1.22
    yaw_goal_tolerance: 0.1   
    
    xy_goal_tolerance: 0.7     
    latch_xy_goal_tolerance: true   
    # dwa_params   
    sim_time: 3.0     
    sim_granularity: 0.025   
    vx_samples: 5   
    vy_samples: 0   
    vth_samples: 30   
    path_distance_bias: 32
    goal_distance_bias: 24  
    occdist_scale: 0.1   
    forward_point_distance: 0.0  # for diff-drive robots recomended set to 0. 
    stop_time_buffer: 0.2 
    oscillation_reset_dist: 0.5   
    oscillation_reset_angle: 0.75     
    publish_traj_pc: true
