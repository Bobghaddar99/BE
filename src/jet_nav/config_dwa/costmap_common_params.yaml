footprint: [[-0.305, -0.655], [-0.305, 0.655], [0.305, 0.655], [0.305, -0.605]]
footprint_padding: 0.01

robot_base_frame: base_link
update_frequency: 2
publish_frequency: 2
transform_tolerance: 0.3

resolution: 0.05

obstacle_range: 6.0
raytrace_range: 5.5

#layer definitions
static:
    map_topic: /map
    subscribe_to_updates: false

obstacles_laser:
    observation_sources: laser
    laser: {data_type: LaserScan, clearing: true, marking: true, topic: /scan_filter, inf_is_valid: true}

inflation_g:
    inflation_radius: 0.1
    
inflation_l:
    inflation_radius: 0.1
