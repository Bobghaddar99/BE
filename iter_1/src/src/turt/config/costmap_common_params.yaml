footprint: [[-0.105,-0.105],[-0.105,0.105],[0.105,0.105],[0.105,-0.105]]
footprint_padding: 0.01

robot_base_frame: base_link
update_frequency: 5
publish_frequency: 2
transform_tolerance: 0.7

resolution: 0.05

obstacle_range: 5.5
raytrace_range: 5.5

#layer definitions

obstacles_laser:
  obstacle_range: 2.5
  raytrace_range: 3.0
  observation_sources: laser_scan
  laser_scan: {sensor_frame: base_scan, data_type: LaserScan, topic: /scan, marking: true, clearing: true}


inflation_g : 
    inflation_radius: 0.2
    cost_scaling_factor: 3.0

inflation_l:
    inflation_radius: 0.2
    cost_scaling_factor: 0.0
